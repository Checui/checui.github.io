- title: Research Projects
  type: time_table
  contents:
    - title: Unsupervised Anomaly Detection for Cardiac MRI
      institution: Imperial College London
      year: 2025 - 2026
      description:
        - Supervised by Dr. Giacomo Tarroni and co-supervised by Dr. Chen Qin.
        - Reviewing state-of-the-art unsupervised anomaly detection methods, including generative and self-supervised approaches, on public cardiac MRI datasets.
        - Focused on detecting structural anomalies such as hypertrophic cardiomyopathy and motion abnormalities without labeled pathology.
        - Evaluation, poster preparation, and final thesis drafting continue through the 2026 submission.
    - title: GAP-KGE
      institution: Ontology Engineering Group
      year: 2025
      description:
        - Worked with Dr. Elvira Amador Dominguez on information extraction from scientific papers using ML and LLM-based models.
        - Built toward automatic template generation for knowledge graph embedding papers.
        - Completed a literature review and set up the project GitHub repository and pipeline.
    - title: Diffusion Model Based Brain Tumor Segmentation Enhanced with Inpainting Method
      institution: BSc thesis
      year: 2025
      description:
        - Worked with U-Net-based diffusion models and applied the RePaint inpainting method to brain tumor segmentation using the BraTS dataset.
        - Completed a literature review on diffusion-based image generation and inpainting methods.
        - Set up the project repository and workflow.
        - Submitted for publication in Computer Methods and Programs in Biomedicine.

